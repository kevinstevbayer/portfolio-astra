name: Build, Verify & Deploy Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Validate, Build, Axe A11y, Lighthouse & Link Check
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      STRICT_PROD: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (>= 22.12.0 from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Optimise source project images into src/assets
        run: npm run optimize:images

      - name: Validate portfolio.json schema, anti-slop rules & production TODO gate
        run: npm run validate

      - name: Verify WCAG 2.2 AA contrast tokens from src/styles/tokens.css
        run: npm run verify:contrast

      - name: Generate build-time Open Graph PNG cards
        run: npm run generate:og

      - name: Run Astro typecheck & static build + internal link/size check
        run: npx astro check && npx astro build && npm run check:links

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright + axe-core WCAG 2.2 AA suite (Light, Dark, 320px, 44x44px, Keyboard, No-JS)
        run: npm run test:a11y

      - name: Run Lighthouse CI mobile audit (95+ all categories, LCP <= 2.0s, CLS <= 0.02)
        run: npm run test:lh

      - name: Check external links in built HTML with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude 'linkedin.com' './dist/**/*.html'
          fail: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4